# Render Blueprint - ONE web service (API + website on one address) + a persistent disk.
# The database is your EXISTING production PostgreSQL (schema "core"). Render does not create or change it.
# Place this file at the ROOT of the GitHub repository (next to the "app" folder), then in Render:
# New > Blueprint > pick the repository. Check plan names/prices in Render before applying.
# A persistent disk needs a paid instance type (not "free").
services:
  - type: web
    name: admissions-portal
    runtime: node
    region: singapore
    plan: starter                # paid; needed for the disk, and it does not sleep
    rootDir: app
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --include=dev
    # No table creation on start: the production database is managed outside Render.
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    # Persistent disk: the unwilling letters (and any other upload) are saved here, so they survive every deploy.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                    # paste the production connection string in the dashboard (postgres://USER:PASSWORD@HOST:5432/DBNAME); never commit it
      - key: DB_PROFILE
        value: production              # schema "core" layout
      - key: DB_SCHEMA
        value: core
      - key: DB_TABLE_PREFIX
        value: enrollment_             # change if your tables have a different prefix; use the exact names in the database
      - key: DATABASE_SSL
        value: "true"                  # the database is reached over the internet
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_IDLE_MINUTES
        value: "30"
