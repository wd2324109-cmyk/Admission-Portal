# nginx in front of the Node server on your own server / AWS EC2 / State Data Centre VM.
# The Node server (pm2 or systemd) listens on 127.0.0.1:4000 and serves both the website and /api.
# Get a certificate first, e.g.:  sudo certbot --nginx -d admissions.example.gov.in

# Brute-force brake for sign-in, on top of the limits inside the Node server (5 requests/min per IP, short bursts allowed).
limit_req_zone $binary_remote_addr zone=admissions_login:10m rate=5r/m;

server_tokens off;

server {
    listen 80;
    server_name admissions.example.gov.in;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name admissions.example.gov.in;
    ssl_certificate     /etc/letsencrypt/live/admissions.example.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admissions.example.gov.in/privkey.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers (the Node server sets the same ones; repeating them protects error pages nginx itself produces).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 25m;          # Excel imports are sent as base64 JSON (backend limit is 25 MB)
    client_body_timeout 30s;
    client_header_timeout 15s;
    gzip on; gzip_types application/json application/javascript text/css;

    # Never serve hidden files (.env, .git) even if one is placed under the site by mistake.
    location ~ /\.(?!well-known) { deny all; return 404; }

    location = /api/auth/login {
        limit_req zone=admissions_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # needed for the sign-in rate limit (TRUST_PROXY=true)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # large imports / selection runs
    }
}
